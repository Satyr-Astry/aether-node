name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff mypy

      - name: Lint
        run: ruff check aether

      - name: Type check
        run: mypy aether --ignore-missing-imports

      - name: Run test suites
        shell: pwsh
        env:
          # runner 默认 stdout 编码是 cp1252，测试输出含中文会抛 UnicodeEncodeError
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          # 测试脚本是独立可执行程序（靠退出码报告结果），不走 pytest 收集
          $failed = @()
          Get-ChildItem tests/test_*.py | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed.Count -gt 0) {
            Write-Host "FAILED: $($failed -join ', ')"
            exit 1
          }
          Write-Host "all suites passed"

  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check frontend syntax
        run: node --check aether/gui/app.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q aether
