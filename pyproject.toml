[project]
name = "aether-node"
version = "0.2.0"
description = "P2P AI 服务网络节点：本地推理打包成接口、签名广播、跨节点路由、计量与代币发放"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.9",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.3"]

[project.scripts]
aether-node = "run:main"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "tests/mock_openai.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
exclude = ["\\.venv", "^data/"]
